# GitHub Actions workflow for React frontend deployment to Azure Static Web Apps
name: Deploy React Frontend to Azure

on:
  push:
    branches:
      - master
    paths:
      - 'portfolio-react/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'portfolio-react/package-lock.json'
      
      - name: Install dependencies
        run: |
          cd portfolio-react
          npm ci
      
      - name: Build React app
        run: |
          cd portfolio-react
          npm run build
        env:
          VITE_API_URL: https://martinlopezrubio.azurewebsites.net
      
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'portfolio-react'
          output_location: 'dist'
          skip_app_build: true
